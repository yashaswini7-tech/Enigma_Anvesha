# Institution names and the narration aliases that identify them.
# Names are used only as recognisable categories to read statement narrations.
# kind: insurer | bank | nbfc | housing_finance | amc | registrar | platform
# default_type: the item type assumed when only the institution is recognised.
# Aliases are matched on whole words after narrations are upper-cased and
# punctuation is replaced by spaces.

institutions:
