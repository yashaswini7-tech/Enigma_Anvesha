[project]
name = "anvesha"
version = "0.1.0"
description = "Finding and closing a deceased person's financial life, from evidence the family already has."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fpdf2>=2.8.8",
    "jinja2>=3.1.6",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvesha"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
